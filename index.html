<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <script>
      // Set the saved theme before first paint to avoid a dark flash in light mode.
      // Mirrors resolveTheme() in src/hooks/useTheme.ts.
      try {
        var savedTheme = localStorage.getItem('rozana-hisaab-theme');
        var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        if (savedTheme === 'light' || (savedTheme !== 'dark' && prefersLight)) {
          document.documentElement.dataset.theme = 'light';
        }
      } catch (e) {}
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rozana Hisaab" />
    <meta name="description" content="Daily expense tracking and automated bill reminders in Pakistan" />
    <title>Rozana Hisaab - روزانہ حساب</title>
    <meta name="twitter:card" content="summary_large_image">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
